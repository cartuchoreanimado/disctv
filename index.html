<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Disctv</title>
  <style>
    :root {
      --bg-tertiary: #1e1f22;
      --bg-secondary: #2b2d31;
      --bg-primary: #313338;
      --bg-message: #383a40;
      --bg-modifier: #35373c;
      --text-normal: #dbdee1;
      --text-muted: #949ba4;
      --blurple: #5865f2;
      --blurple-hover: #4752c4;
      --green: #23a559;
      --red: #f23f43;
      --header-primary: #f2f3f5;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: "gg sans","Noto Sans","Helvetica Neue",Helvetica,Arial,sans-serif; }
    body { display: flex; height: 100vh; background: var(--bg-primary); color: var(--text-normal); overflow: hidden; }

    /* LOGIN */
    #login-screen {
      position: fixed; inset: 0; background: #5865f2;
      display: flex; align-items: center; justify-content: center; z-index: 1000;
    }
    #login-screen.hidden { display: none; }
    .login-box {
      background: var(--bg-primary); border-radius: 8px; padding: 32px;
      width: 100%; max-width: 480px; box-shadow: 0 2px 10px rgba(0,0,0,.2);
    }
    .login-box h1 { color: var(--header-primary); font-size: 24px; font-weight: 600; text-align: center; margin-bottom: 8px; }
    .login-box p { color: var(--text-muted); text-align: center; font-size: 16px; margin-bottom: 20px; }
    .login-label { display: block; color: var(--text-muted); font-size: 12px; font-weight: 700; text-transform: uppercase; margin-bottom: 8px; }
    .login-input {
      width: 100%; background: var(--bg-tertiary); border: none; border-radius: 4px;
      padding: 10px; color: var(--text-normal); font-size: 16px; margin-bottom: 20px; outline: none;
    }
    .login-input:focus { outline: 1px solid var(--blurple); }
    .login-btn {
      width: 100%; background: var(--blurple); color: #fff; border: none; border-radius: 4px;
      padding: 12px; font-size: 16px; font-weight: 500; cursor: pointer;
    }
    .login-btn:hover { background: var(--blurple-hover); }
    .login-error { color: var(--red); font-size: 14px; margin-bottom: 12px; display: none; }

    /* LAYOUT DISCORD */
    .servers {
      width: 72px; background: var(--bg-tertiary); display: flex; flex-direction: column;
      align-items: center; padding: 12px 0; gap: 8px; flex-shrink: 0;
    }
    .server-icon {
      width: 48px; height: 48px; background: var(--bg-primary); border-radius: 50%;
      display: flex; align-items: center; justify-content: center; cursor: pointer;
      color: #fff; font-weight: 700; font-size: 16px; transition: .15s;
    }
    .server-icon:hover, .server-icon.active { border-radius: 16px; background: var(--blurple); }
    .server-separator { width: 32px; height: 2px; background: var(--bg-modifier); border-radius: 1px; margin: 4px 0; }

    .sidebar {
      width: 240px; background: var(--bg-secondary); display: flex; flex-direction: column; flex-shrink: 0;
    }
    .server-header {
      height: 48px; padding: 0 16px; display: flex; align-items: center; justify-content: space-between;
      box-shadow: 0 1px 0 rgba(0,0,0,.2); color: var(--header-primary); font-weight: 600; font-size: 16px;
    }
    .status-dot { font-size: 11px; font-weight: 500; }
    .status-dot.online { color: var(--green); }
    .status-dot.offline { color: var(--red); }

    .channels { flex: 1; padding: 16px 8px; overflow-y: auto; }
    .channel-category {
      color: var(--text-muted); font-size: 12px; font-weight: 700; text-transform: uppercase;
      padding: 0 8px; margin-bottom: 4px;
    }
    .channel {
      padding: 6px 8px; border-radius: 4px; display: flex; align-items: center; gap: 6px;
      color: var(--text-muted); font-weight: 500; font-size: 16px; cursor: pointer;
    }
    .channel:hover, .channel.active { background: var(--bg-modifier); color: #fff; }
    .hashtag { font-size: 20px; color: var(--text-muted); }

    .user-panel {
      height: 52px; background: #232428; padding: 0 8px; display: flex; align-items: center; gap: 8px;
    }
    .user-avatar {
      width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center;
      justify-content: center; font-weight: 700; font-size: 14px; color: #fff; flex-shrink: 0;
    }
    .user-info { flex: 1; min-width: 0; line-height: 1.2; }
    .user-name { font-size: 14px; font-weight: 600; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .user-status { font-size: 12px; color: var(--text-muted); }
    .logout-btn {
      background: transparent; border: none; color: var(--text-muted); cursor: pointer;
      font-size: 12px; padding: 4px 8px; border-radius: 4px;
    }
    .logout-btn:hover { background: var(--bg-modifier); color: #fff; }

    .chat-area { flex: 1; display: flex; flex-direction: column; min-width: 0; background: var(--bg-primary); }
    .chat-header {
      height: 48px; padding: 0 16px; display: flex; align-items: center; gap: 8px;
      box-shadow: 0 1px 0 rgba(0,0,0,.2); color: #fff; font-weight: 600; font-size: 16px;
    }

    .messages { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
    .message { display: flex; gap: 16px; padding: 2px 0; margin-top: 12px; }
    .message:hover { background: rgba(0,0,0,.04); }
    .msg-avatar {
      width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center; font-weight: 700; color: #fff; font-size: 16px;
    }
    .msg-content { flex: 1; min-width: 0; }
    .msg-header { display: flex; align-items: baseline; gap: 8px; margin-bottom: 2px; }
    .msg-author { color: #fff; font-weight: 500; font-size: 16px; }
    .msg-time { font-size: 12px; color: var(--text-muted); }
    .msg-text { font-size: 16px; line-height: 1.375; word-break: break-word; white-space: pre-wrap; color: var(--text-normal); }

    .input-area { padding: 0 16px 24px; }
    .input-box {
      background: var(--bg-message); border-radius: 8px; padding: 0 12px;
      display: flex; align-items: center; min-height: 44px; gap: 8px;
    }
    .input-box input[type="text"] {
      flex: 1; background: transparent; border: none; color: var(--text-normal);
      font-size: 16px; outline: none; padding: 11px 0;
    }
    .input-box input::placeholder { color: var(--text-muted); }

    .messages::-webkit-scrollbar, .channels::-webkit-scrollbar { width: 8px; }
    .messages::-webkit-scrollbar-thumb, .channels::-webkit-scrollbar-thumb {
      background: var(--bg-tertiary); border-radius: 4px;
    }
  </style>
</head>
<body>

  <!-- TELA DE LOGIN COM SENHA -->
  <div id="login-screen">
    <div class="login-box">
      <h1>Bem-vindo de volta!</h1>
      <p>Estamos animados em te ver no Disctv</p>
      <div class="login-error" id="login-error">Nome ou senha incorretos.</div>
      <label class="login-label">Nome de usuário</label>
      <input type="text" class="login-input" id="login-name" maxlength="20" autocomplete="username">
      <label class="login-label">Senha</label>
      <input type="password" class="login-input" id="login-pass" maxlength="40" autocomplete="current-password">
      <button class="login-btn" id="login-btn">Entrar</button>
      <p style="margin-top:16px;font-size:14px;color:var(--text-muted);text-align:left;">
        Primeira vez? Digite um nome e uma senha novos para criar sua conta local.
      </p>
    </div>
  </div>

  <div class="servers">
    <div class="server-icon active" title="Disctv">DT</div>
    <div class="server-separator"></div>
  </div>

  <div class="sidebar">
    <div class="server-header">
      <span>Disctv</span>
      <span class="status-dot offline" id="status">● offline</span>
    </div>
    <div class="channels">
      <div class="channel-category">Canais de texto</div>
      <div class="channel active"><span class="hashtag">#</span> geral</div>
    </div>
    <div class="user-panel">
      <div class="user-avatar" id="my-avatar">?</div>
      <div class="user-info">
        <div class="user-name" id="my-name">—</div>
        <div class="user-status">Online</div>
      </div>
      <button class="logout-btn" id="logout-btn">Sair</button>
    </div>
  </div>

  <div class="chat-area">
    <div class="chat-header">
      <span class="hashtag" style="font-size:24px;color:var(--text-muted);">#</span>
      <span>geral</span>
    </div>
    <div class="messages" id="chat-container"></div>
    <div class="input-area">
      <div class="input-box">
        <input type="text" id="chat-input" placeholder="Conversar em #geral" autocomplete="off" disabled>
      </div>
    </div>
  </div>

<script>
  // ===== NOME DA SUA SALA (Você pode inventar qualquer nome único aqui) =====
  const ROOM_NAME = 'disctv_cartucho_sala_oficial_2026'; 
  const NTFY_URL = 'https://ntfy.sh/' + ROOM_NAME;

  const COLORS = ['#5865f2','#23a559','#f23f43','#f0b232','#eb459e','#57f287','#ed4245','#3ba55d','#faa61a'];

  const loginScreen = document.getElementById('login-screen');
  const loginName = document.getElementById('login-name');
  const loginPass = document.getElementById('login-pass');
  const loginBtn = document.getElementById('login-btn');
  const loginError = document.getElementById('login-error');
  const chatContainer = document.getElementById('chat-container');
  const chatInput = document.getElementById('chat-input');
  const statusEl = document.getElementById('status');
  const myAvatar = document.getElementById('my-avatar');
  const myNameEl = document.getElementById('my-name');
  const logoutBtn = document.getElementById('logout-btn');

  let myName = '', myColor = '';
  const seen = new Set();

  function simpleHash(str) {
    let h = 0;
    for (let i = 0; i < str.length; i++) { h = ((h << 5) - h) + str.charCodeAt(i); h |= 0; }
    return 'h' + Math.abs(h).toString(16);
  }

  function tryLogin() {
    const name = loginName.value.trim();
    const pass = loginPass.value;
    if (!name || name.length < 2) { showError('Nome precisa ter pelo menos 2 caracteres.'); return; }
    if (!pass || pass.length < 3) { showError('Senha precisa ter pelo menos 3 caracteres.'); return; }

    const users = JSON.parse(localStorage.getItem('disctv_users') || '{}');
    const hash = simpleHash(pass);

    if (users[name]) {
      if (users[name].pass !== hash) { showError('Nome ou senha incorretos.'); return; }
      myColor = users[name].color;
    } else {
      myColor = COLORS[Math.floor(Math.random() * COLORS.length)];
      users[name] = { pass: hash, color: myColor };
      localStorage.setItem('disctv_users', JSON.stringify(users));
    }

    myName = name;
    localStorage.setItem('disctv_session', JSON.stringify({ name: myName, color: myColor }));
    enterApp();
  }

  function showError(msg) {
    loginError.textContent = msg;
    loginError.style.display = 'block';
  }

  function enterApp() {
    loginScreen.classList.add('hidden');
    myNameEl.textContent = myName;
    myAvatar.textContent = myName[0].toUpperCase();
    myAvatar.style.background = myColor;
    chatInput.disabled = false;
    chatInput.focus();
    startOnlineChat();
  }

  function logout() {
    localStorage.removeItem('disctv_session');
    location.reload();
  }

  (function checkSession() {
    try {
      const s = JSON.parse(localStorage.getItem('disctv_session') || 'null');
      if (s && s.name) { myName = s.name; myColor = s.color || COLORS[0]; enterApp(); }
    } catch(e) {}
  })();

  loginBtn.addEventListener('click', tryLogin);
  loginPass.addEventListener('keypress', e => { if (e.key === 'Enter') tryLogin(); });
  loginName.addEventListener('keypress', e => { if (e.key === 'Enter') loginPass.focus(); });
  logoutBtn.addEventListener('click', logout);

  // ===== CONEXÃO ONLINE DIRETA SEM CONTA =====
  function startOnlineChat() {
    statusEl.textContent = '● conectando...';
    statusEl.className = 'status-dot';

    // Conecta ao canal online e puxa o histórico recente
    const eventSource = new EventSource(NTFY_URL + '/json?since=12h');

    eventSource.onopen = () => {
      statusEl.textContent = '● online';
      statusEl.className = 'status-dot online';
    };

    eventSource.onerror = () => {
      statusEl.textContent = '● reconectando...';
      statusEl.className = 'status-dot offline';
    };

    eventSource.onmessage = (event) => {
      try {
        const item = JSON.parse(event.data);
        if (item.event === 'message' && item.message) {
          const payload = JSON.parse(item.message);
          addMessage(item.id, payload.author, payload.text, payload.color, item.time * 1000);
        }
      } catch(err) {
        // ignora se não for JSON do chat
      }
    };
  }

  function escapeHTML(str) {
    return String(str || '')
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function formatTime(ts) {
    const d = new Date(ts || Date.now());
    const h = String(d.getHours()).padStart(2, '0');
    const m = String(d.getMinutes()).padStart(2, '0');
    return 'Hoje às ' + h + ':' + m;
  }

  function linkify(text) {
    return escapeHTML(text).replace(
      /(https?:\/\/[^\s<]+)/g,
      '<a href="$1" target="_blank" rel="noopener" style="color:#00a8fc">$1</a>'
    );
  }

  function addMessage(id, author, text, color, time) {
    if (seen.has(id)) return;
    seen.add(id);

    const letter = (author || '?')[0].toUpperCase();

    const html =
      '<div class="message" id="msg-' + id + '">' +
        '<div class="msg-avatar" style="background:' + (color || '#5865f2') + '">' + letter + '</div>' +
        '<div class="msg-content">' +
          '<div class="msg-header">' +
            '<span class="msg-author">' + escapeHTML(author || 'Anônimo') + '</span>' +
            '<span class="msg-time">' + formatTime(time) + '</span>' +
          '</div>' +
          '<div class="msg-text">' + linkify(text) + '</div>' +
        '</div>' +
      '</div>';

    chatContainer.insertAdjacentHTML('beforeend', html);
    chatContainer.scrollTop = chatContainer.scrollHeight;
  }

  async function sendMessage() {
    if (!myName) return;
    const texto = chatInput.value.trim();
    if (!texto) return;

    const payload = {
      author: myName,
      text: texto,
      color: myColor
    };

    chatInput.value = '';

    // Envia a mensagem direto pro canal online público
    try {
      await fetch(NTFY_URL, {
        method: 'POST',
        body: JSON.stringify(payload)
      });
    } catch(e) {
      console.error("Erro ao enviar mensagem:", e);
    }
  }

  chatInput.addEventListener('keypress', e => {
    if (e.key === 'Enter') sendMessage();
  });
</script>
</body>
</html>
