<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat com Envio de Imagens</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #chat-container {
            width: 100%;
            max-width: 600px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 70vh;
        }

        #messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            border-bottom: 1px solid #eee;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message {
            padding: 10px 15px;
            border-radius: 20px;
            max-width: 80%;
            word-wrap: break-word;
        }

        .message.my-message {
            background-color: #007bff;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 5px;
        }

        .message.other-message {
            background-color: #e9ecef;
            color: black;
            align-self: flex-start;
            border-bottom-left-radius: 5px;
        }
        
        .message img {
            max-width: 100%;
            border-radius: 8px;
            margin-top: 5px;
        }

        #input-area {
            display: flex;
            padding: 10px;
            background: #f8f9fa;
        }

        #message-input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 20px;
            outline: none;
            margin-right: 10px;
        }

        #send-btn, #photo-btn {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 50%;
            cursor: pointer;
            margin-left: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }
        
        #photo-btn {
            background-color: #28a745;
        }

        #send-btn:hover { background-color: #0056b3; }
        #photo-btn:hover { background-color: #218838; }

        /* Estilos do Login (para corrigir o erro do form) */
        #login-container {
             width: 100%;
            max-width: 300px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            padding: 20px;
            margin-bottom: 20px;
        }
        
        #login-container input {
            width: calc(100% - 22px);
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box; /* Garante que padding não aumente o width */
        }
        
        #login-container button {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

    </style>
</head>
<body>

    <!-- LOGIN CORRIGIDO COM FORMULARIO -->
    <div id="login-container">
        <h3>Login</h3>
        <form id="form-login">
            <input type="text" id="login-user" placeholder="Seu Nome" required>
            <!-- O input de senha agora está dentro de um form, sumindo o erro do Chrome -->
            <input type="password" class="login-input" id="login-pass" maxlength="40" placeholder="Senha" required>
            <button type="submit">Entrar no Chat</button>
        </form>
    </div>

    <!-- CHAT CONTAINER -->
    <div id="chat-container" style="display: none;">
        <div id="messages"></div>
        <div id="input-area">
            <!-- Botão de Foto (o input file fica escondido) -->
            <input type="file" id="input-foto" accept="image/*" style="display: none;">
            <button id="photo-btn" onclick="document.getElementById('input-foto').click()">📷</button>
            
            <input type="text" id="message-input" placeholder="Digite uma mensagem...">
            <button id="send-btn">➤</button>
        </div>
    </div>

    <script>
        // === CONFIGURAÇÕES ===
        // TÓPICO CURTO PARA NÃO DAR ERRO 404 NO NTFY (< 64 caracteres)
        const TOPIC = 'disctv_pv_cartucho_paula'; 
        const NTFY_URL = `https://ntfy.sh/${TOPIC}`;
        
        // CHAVE DA API DO IMGBB (Você precisa criar uma conta gratuita e pegar a sua)
        // Substitua 'SUA_CHAVE_AQUI' pela sua chave real do ImgBB.
        const IMGBB_API_KEY = 'SUA_CHAVE_AQUI'; 

        let meuNome = '';

        // === LÓGICA DE LOGIN ===
        document.getElementById('form-login').addEventListener('submit', function(e) {
            e.preventDefault(); // Não deixa a página recarregar
            meuNome = document.getElementById('login-user').value;
            document.getElementById('login-container').style.display = 'none';
            document.getElementById('chat-container').style.display = 'flex';
            
            // Inicia a escuta de mensagens (SSE)
            iniciarEscuta();
        });

        // === LÓGICA DE ENVIO DE MENSAGEM DE TEXTO ===
        document.getElementById('send-btn').addEventListener('click', enviarMensagemTexto);
        document.getElementById('message-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') enviarMensagemTexto();
        });

        function enviarMensagemTexto() {
            const input = document.getElementById('message-input');
            const texto = input.value.trim();
            if (!texto) return;

            const payload = {
                user: meuNome,
                tipo: 'texto',
                conteudo: texto
            };

            enviarParaNtfy(payload);
            input.value = '';
        }

        // === LÓGICA DE ENVIO DE FOTO ===
        document.getElementById('input-foto').addEventListener('change', function() {
            const file = this.files[0];
            if (!file) return;

            // Se for Github Pages (só frontend), o jeito mais prático de enviar fotos
            // é transformando ela em Base64 ou subindo pra um host (ImgBB).
            // Base64 pode ficar muito grande e o ntfy rejeitar. Então, ImgBB é melhor.
            
            // *AVISO:* Como você só tem HTML no GitHub, se você não quiser usar o ImgBB, 
            // a alternativa seria usar Base64 (mas o ntfy tem limite de tamanho).
            // Vamos tentar Base64 primeiro, pois é mais fácil e não precisa de API Key externa se a foto for pequena.
            
            const reader = new FileReader();
            reader.onload = function(event) {
                const base64Image = event.target.result;
                
                // Redimensionar a imagem antes de enviar seria o ideal, mas vamos tentar direto
                const payload = {
                    user: meuNome,
                    tipo: 'imagem',
                    conteudo: base64Image // string gigante da imagem
                };
                
                enviarParaNtfy(payload);
            };
            reader.readAsDataURL(file);
        });

        // === FUNÇÃO CENTRAL PARA ENVIAR PRO NTFY ===
        function enviarParaNtfy(payload) {
            fetch(NTFY_URL, {
                method: 'POST',
                body: JSON.stringify(payload)
            }).then(response => {
                if (!response.ok) {
                    console.error('Erro ao enviar:', response.status);
                    alert("Erro ao enviar mensagem. Tópico muito grande ou imagem pesada?");
                }
            }).catch(err => console.error("Falha no fetch:", err));
        }

        // === LÓGICA DE ESCUTA (SSE) ===
        function iniciarEscuta() {
            const eventSource = new EventSource(`${NTFY_URL}/sse`);
            
            eventSource.onmessage = function(event) {
                const data = JSON.parse(event.data);
                if (data.event === 'message') {
                    try {
                        const payload = JSON.parse(data.message);
                        exibirMensagem(payload);
                    } catch (e) {
                        console.log("Mensagem ignorada (não é JSON):", data.message);
                    }
                }
            };
            
            eventSource.onerror = function(err) {
                console.error("Erro no EventSource (SSE)", err);
                // Pode ser o erro 404 se o tópico ainda estiver com nome muito grande.
            };
        }

        // === RENDERIZAR MENSAGEM NA TELA ===
        function exibirMensagem(payload) {
            const messagesDiv = document.getElementById('messages');
            const messageEl = document.createElement('div');
            messageEl.classList.add('message');
            
            if (payload.user === meuNome) {
                messageEl.classList.add('my-message');
            } else {
                messageEl.classList.add('other-message');
            }

            // Define se é texto ou imagem
            if (payload.tipo === 'imagem') {
                const img = document.createElement('img');
                img.src = payload.conteudo;
                messageEl.appendChild(img);
                
                // Adiciona o nome de quem enviou pequenininho se não for eu
                if(payload.user !== meuNome) {
                     const nameSpan = document.createElement('div');
                     nameSpan.style.fontSize = '10px';
                     nameSpan.innerText = payload.user;
                     messageEl.prepend(nameSpan);
                }
            } else {
                messageEl.innerHTML = `<strong>${payload.user !== meuNome ? payload.user + ': ' : ''}</strong>${payload.conteudo}`;
            }

            messagesDiv.appendChild(messageEl);
            messagesDiv.scrollTop = messagesDiv.scrollHeight; // Rola pra baixo
        }
    </script>
</body>
</html>
