<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Disctv - Mobile</title>
  <style>
    :root {
      --bg-tertiary: #1e1f22;
      --bg-secondary: #2b2d31;
      --bg-primary: #313338;
      --bg-message: #383a40;
      --bg-modifier: #35373c;
      --bg-modifier-hover: #3f4147;
      --text-normal: #dbdee1;
      --text-muted: #949ba4;
      --blurple: #5865f2;
      --blurple-hover: #4752c4;
      --green: #23a559;
      --red: #f23f43;
      --header-primary: #f2f3f5;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: "gg sans","Noto Sans","Helvetica Neue",Helvetica,Arial,sans-serif; -webkit-tap-highlight-color: transparent; }
    body { display: flex; height: 100vh; height: 100dvh; background: var(--bg-primary); color: var(--text-normal); overflow: hidden; position: relative; }

    #login-screen { position: fixed; inset: 0; background: #5865f2; display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 16px; }
    #login-screen.hidden { display: none; }
    .login-box { background: var(--bg-primary); border-radius: 8px; padding: 24px; width: 100%; max-width: 400px; box-shadow: 0 2px 10px rgba(0,0,0,.2); }
    .login-box h1 { color: var(--header-primary); font-size: 22px; font-weight: 600; text-align: center; margin-bottom: 6px; }
    .login-box p { color: var(--text-muted); text-align: center; font-size: 14px; margin-bottom: 16px; }
    .login-label { display: block; color: var(--text-muted); font-size: 11px; font-weight: 700; text-transform: uppercase; margin-bottom: 6px; }
    .login-input { width: 100%; background: var(--bg-tertiary); border: none; border-radius: 4px; padding: 10px; color: var(--text-normal); font-size: 15px; margin-bottom: 16px; outline: none; }
    .login-input:focus { outline: 1px solid var(--blurple); }
    .login-btn { width: 100%; background: var(--blurple); color: #fff; border: none; border-radius: 4px; padding: 12px; font-size: 15px; font-weight: 500; cursor: pointer; }
    .login-error { color: var(--red); font-size: 13px; margin-bottom: 10px; display: none; }

    .servers { width: 64px; background: var(--bg-tertiary); display: flex; flex-direction: column; align-items: center; padding: 10px 0; gap: 8px; flex-shrink: 0; z-index: 20; overflow-y: auto; }
    .server-icon { width: 44px; height: 44px; background: var(--bg-primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #fff; font-weight: 700; font-size: 15px; transition: .15s; overflow: hidden; flex-shrink: 0; position: relative; }
    .server-icon img { width: 100%; height: 100%; object-fit: cover; }
    .server-icon:hover, .server-icon.active { border-radius: 14px; background: var(--blurple); }
    .server-separator { width: 24px; height: 2px; background: var(--bg-modifier); border-radius: 1px; margin: 2px 0; }

    .sidebar { position: absolute; left: 64px; top: 0; bottom: 0; width: 230px; background: var(--bg-secondary); display: flex; flex-direction: column; flex-shrink: 0; z-index: 15; transition: transform 0.25s ease; transform: translateX(-120%); }
    .sidebar.open { transform: translateX(0); box-shadow: 5px 0 15px rgba(0,0,0,0.4); }
    @media (min-width: 768px) {
      .sidebar { position: relative; left: 0; transform: none !important; box-shadow: none; }
    }

    .sidebar-header { height: 48px; padding: 0 12px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 1px 0 rgba(0,0,0,.2); color: var(--header-primary); font-weight: 600; font-size: 15px; }
    .sidebar-content { flex: 1; padding: 12px 6px; overflow-y: auto; }

    .category-title { color: var(--text-muted); font-size: 11px; font-weight: 700; text-transform: uppercase; padding: 0 6px; margin-bottom: 4px; margin-top: 10px; display: flex; justify-content: space-between; align-items: center; }
    .list-item { padding: 6px 8px; border-radius: 4px; display: flex; align-items: center; justify-content: space-between; color: var(--text-muted); font-weight: 500; font-size: 15px; cursor: pointer; margin-bottom: 2px; }
    .list-item:hover, .list-item.active { background: var(--bg-modifier); color: #fff; }
    .list-item-left { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1; }
    .list-item-avatar { width: 22px; height: 22px; border-radius: 50%; overflow: hidden; background: var(--bg-primary); display: flex; align-items: center; justify-content: center; font-size: 10px; color: #fff; font-weight: bold; flex-shrink: 0; }
    .list-item-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .hashtag { font-size: 18px; color: var(--text-muted); }

    .req-actions { display: flex; gap: 4px; }
    .req-btn { background: var(--bg-modifier); border: none; width: 24px; height: 24px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; color: #fff; }
    .req-btn.accept:hover { background: var(--green); }
    .req-btn.reject:hover { background: var(--red); }

    .user-panel { height: 50px; background: #232428; padding: 0 6px; display: flex; align-items: center; gap: 6px; }
    .user-avatar { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; color: #fff; flex-shrink: 0; cursor: pointer; overflow: hidden; }
    .user-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .user-info { flex: 1; min-width: 0; line-height: 1.1; }
    .user-name { font-size: 13px; font-weight: 600; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .logout-btn { background: transparent; border: none; color: var(--text-muted); cursor: pointer; font-size: 11px; padding: 4px 6px; border-radius: 4px; }
    #avatar-input { display: none; }

    .chat-area { flex: 1; display: flex; flex-direction: column; min-width: 0; background: var(--bg-primary); position: relative; }
    .chat-header { height: 48px; padding: 0 12px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 1px 0 rgba(0,0,0,.2); color: #fff; font-weight: 600; font-size: 15px; }
    .chat-header-left { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .menu-toggle-btn { background: transparent; border: none; color: var(--header-primary); font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    @media (min-width: 768px) { .menu-toggle-btn { display: none; } }
    
    .messages { flex: 1; padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; -webkit-overflow-scrolling: touch; }
    .message { display: flex; gap: 12px; padding: 2px 8px; margin-top: 10px; }
    .msg-avatar { width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0; overflow: hidden; display: flex; align-items: center; justify-content: center; font-weight: 700; color: #fff; font-size: 14px; cursor: pointer; }
    .msg-avatar img { width: 100%; height: 100%; object-fit: cover; }
    
    .msg-content { flex: 1; min-width: 0; }
    .msg-header { display: flex; align-items: baseline; gap: 6px; margin-bottom: 2px; }
    .msg-author { color: #fff; font-weight: 500; font-size: 15px; cursor: pointer; }
    .msg-author:hover { text-decoration: underline; }
    .msg-time { font-size: 11px; color: var(--text-muted); }
    .msg-text { font-size: 15px; line-height: 1.35; word-break: break-word; white-space: pre-wrap; color: var(--text-normal); }
    .msg-media { max-width: 100%; max-height: 220px; border-radius: 6px; margin-top: 6px; display: block; object-fit: contain; background: #000; }

    .input-area { padding: 8px 12px 16px; position: relative; }
    .input-box { background: var(--bg-message); border-radius: 8px; padding: 0 10px; display: flex; align-items: center; min-height: 42px; gap: 6px; }
    .input-box input[type="text"] { flex: 1; background: transparent; border: none; color: var(--text-normal); font-size: 15px; outline: none; padding: 10px 0; }
    .input-box input::placeholder { color: var(--text-muted); }
    .attach-btn { background: transparent; border: none; color: var(--text-muted); font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 4px; }
    #chat-file-input { display: none; }

    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; z-index: 2000; padding: 16px; }
    .modal-box { background: var(--bg-primary); padding: 20px; border-radius: 8px; width: 100%; max-width: 380px; box-shadow: 0 8px 16px rgba(0,0,0,0.3); }
    .modal-title { color: #fff; font-size: 18px; font-weight: 600; margin-bottom: 6px; text-align: center; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; background: var(--bg-secondary); padding: 12px; margin: 20px -20px -20px -20px; border-radius: 0 0 8px 8px; }
    .modal-btn { padding: 8px 16px; border-radius: 4px; font-weight: 500; font-size: 13px; cursor: pointer; border: none; width: 100%; text-align: center; }
    .modal-btn.cancel { background: transparent; color: #fff; }
    .modal-btn.submit { background: var(--blurple); color: #fff; }

    .invite-friend-row { display: flex; align-items: center; justify-content: space-between; padding: 6px; border-radius: 4px; margin-bottom: 4px; }
    .invite-btn { background: transparent; border: 1px solid var(--green); color: var(--green); padding: 4px 10px; border-radius: 4px; font-weight: 600; cursor: pointer; font-size: 12px; }
    .invite-btn.sent { border-color: var(--text-muted); color: var(--text-muted); background: transparent; }
  </style>
</head>
<body>

  <div id="login-screen">
    <div class="login-box">
      <h1>Bem-vindo!</h1>
      <p>Disctv Versão Mobile</p>
      <div class="login-error" id="login-error">Nome ou senha incorretos.</div>
      <form id="login-form">
        <label class="login-label">Nome de usuário</label>
        <input type="text" class="login-input" id="login-name" maxlength="20" autocomplete="off" required>
        <label class="login-label">Senha</label>
        <input type="password" class="login-input" id="login-pass" maxlength="40" required>
        <button type="submit" class="login-btn">Entrar</button>
      </form>
    </div>
  </div>

  <div class="servers" id="servers-sidebar">
    <div class="server-icon home-icon active" id="btn-home" title="Mensagens Diretas">
      <img src="logo.png" alt="Disctv" onerror="this.style.display='none';this.parentElement.textContent='D';">
    </div>
    <div class="server-separator"></div>
    <div class="server-icon" id="btn-server" title="Servidor Oficial">S</div>
    <div class="server-icon" id="btn-add-server" title="Adicionar Servidor" style="background: var(--bg-secondary); color: var(--green); font-size: 22px;">+</div>
  </div>

  <div class="sidebar" id="app-sidebar">
    <div class="sidebar-header" id="sidebar-header">
      <span id="sidebar-title">Início</span>
    </div>
    
    <div class="sidebar-content" id="sidebar-server" style="display: none;">
      <div class="category-title">Canais de texto</div>
      <div class="list-item active" id="btn-channel-geral">
        <div class="list-item-left"><span class="hashtag">#</span> geral</div>
      </div>
    </div>
    
    <div class="sidebar-content" id="sidebar-dms">
      <div class="category-title"><span>Solicitações</span></div>
      <div id="request-list"></div>

      <div class="category-title"><span>Amigos (DMs)</span></div>
      <div id="dm-list"></div>
    </div>

    <div class="user-panel">
      <input type="file" id="avatar-input" accept="image/*">
      <div class="user-avatar" id="my-avatar">?</div>
      <div class="user-info">
        <div class="user-name" id="my-name">—</div>
      </div>
      <button class="logout-btn" id="logout-btn">Sair</button>
    </div>
  </div>

  <div class="chat-area" id="chat-area">
    <div class="chat-header">
      <div class="chat-header-left">
        <button class="menu-toggle-btn" id="menu-toggle" onclick="toggleSidebar()">☰</button>
        <span class="chat-header-icon" id="chat-icon">@</span>
        <span id="chat-title" style="white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">amigos</span>
      </div>
      <div id="chat-header-actions" style="display: flex; gap: 6px;"></div>
    </div>
    <div class="messages" id="chat-container"></div>
    <div class="input-area" id="input-area-box">
      <div class="input-box">
        <input type="file" id="chat-file-input" accept="image/*,video/*">
        <button class="attach-btn" id="btn-attach">+</button>
        <input type="text" id="chat-input" placeholder="Mensagem..." autocomplete="off">
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="modal-create-server">
    <div class="modal-box">
      <div class="modal-title">Criar servidor</div>
      <label class="login-label">Nome do Servidor</label>
      <input type="text" class="login-input" id="input-new-server-name" placeholder="Ex: Meu Servidor" autocomplete="off">
      <div class="modal-actions">
        <button class="modal-btn cancel" id="btn-cancel-server">Voltar</button>
        <button class="modal-btn submit" id="btn-confirm-server">Criar</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="modal-invite">
    <div class="modal-box">
      <div class="modal-title">Convidar amigos</div>
      <div id="invite-friends-list" style="max-height: 200px; overflow-y: auto; margin-top: 8px;"></div>
      <div class="modal-actions">
        <button class="modal-btn submit" id="btn-close-invite" style="width: 100%;">Concluído</button>
      </div>
    </div>
  </div>


  <div class="modal-overlay" id="modal-user-profile">
    <div class="modal-box" style="text-align: center;">
      <div id="profile-modal-avatar" class="user-avatar" style="width: 60px; height: 60px; margin: 0 auto 12px; font-size: 24px;">?</div>
      <div class="modal-title" id="profile-modal-name" style="margin-bottom: 16px;">Nome</div>
      <div id="profile-modal-actions"></div>
      <div class="modal-actions" style="margin-top: 15px;">
        <button class="modal-btn cancel" onclick="document.getElementById('modal-user-profile').style.display='none'">Fechar</button>
      </div>
    </div>
  </div>

<script>
  const OFFICIAL_ROOM = 'dtv_srv_geral'; 
  const NTFY_URL = 'https://ntfy.sh/';
  const COLORS = ['#5865f2','#23a559','#f23f43','#f0b232','#eb459e','#57f287','#ed4245','#3ba55d','#faa61a'];

  let myName = '', myColor = '', myProfilePic = '';
  let currentView = 'dm', currentDM = '', currentCustomServerId = '', currentCustomServerName = '';
  let eventSource = null, notifEventSource = null;
  const seen = new Set();

  let friends = [];
  let requests = [];
  let sentRequests = [];
  let customServers = [];

  function loadUserData() {
    if (!myName) return;
    friends = JSON.parse(localStorage.getItem('disctv_friends_' + myName) || '[]');
    requests = JSON.parse(localStorage.getItem('disctv_requests_' + myName) || '[]');
    sentRequests = JSON.parse(localStorage.getItem('disctv_sent_' + myName) || '[]');
    customServers = JSON.parse(localStorage.getItem('disctv_servers_' + myName) || '[]');
  }

  function saveUserData() {
    if (!myName) return;
    localStorage.setItem('disctv_friends_' + myName, JSON.stringify(friends));
    localStorage.setItem('disctv_requests_' + myName, JSON.stringify(requests));
    localStorage.setItem('disctv_sent_' + myName, JSON.stringify(sentRequests));
    localStorage.setItem('disctv_servers_' + myName, JSON.stringify(customServers));
  }

  function sanitizeTopic(str) {
    return (str || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]/g, '_');
  }

  function toggleSidebar() {
    document.getElementById('app-sidebar').classList.toggle('open');
  }

  function tryLogin(e) {
    if (e) e.preventDefault();
    const name = document.getElementById('login-name').value.trim();
    const pass = document.getElementById('login-pass').value;
    const errorEl = document.getElementById('login-error');
    
    if (name.length < 2 || pass.length < 3) { 
      errorEl.textContent = 'Dados muito curtos.';
      errorEl.style.display = 'block'; 
      return; 
    }
    
    const users = JSON.parse(localStorage.getItem('disctv_users') || '{}');
    let hash = '';
    for(let i=0; i<pass.length; i++) { hash += pass.charCodeAt(i).toString(16); }

    if (users[name]) {
      if (users[name].pass !== hash) { 
        errorEl.textContent = 'Senha incorreta.';
        errorEl.style.display = 'block'; 
        return; 
      }
      myColor = users[name].color; 
      myProfilePic = users[name].avatar || '';
    } else {
      myColor = COLORS[Math.floor(Math.random() * COLORS.length)];
      users[name] = { pass: hash, color: myColor, avatar: '' };
      localStorage.setItem('disctv_users', JSON.stringify(users));
    }
    myName = name;
    loadUserData();
    localStorage.setItem('disctv_session', JSON.stringify({ name: myName, color: myColor, avatar: myProfilePic }));
    enterApp();
  }

  function renderMyAvatar() {
    const el = document.getElementById('my-avatar');
    if (myProfilePic) { 
      el.innerHTML = '<img src="' + myProfilePic + '">'; 
      el.style.background = 'transparent';
    } else { 
      el.textContent = myName[0].toUpperCase(); 
      el.style.background = myColor;
    }
  }

  function enterApp() {
    document.getElementById('login-screen').classList.add('hidden');
    document.getElementById('my-name').textContent = myName;
    renderMyAvatar();
    renderSidebarLists();
    renderCustomServersUI();
    connectToNotifications();
    openHome();
  }

  function getChannelName() {
    if (currentView === 'server') return OFFICIAL_ROOM;
    if (currentView === 'custom_server') return currentCustomServerId;
    if (currentView === 'dm' && currentDM) {
      const a = sanitizeTopic(myName);
      const b = sanitizeTopic(currentDM);
      const arr = [a, b].sort();
      return 'dtv_p_' + arr[0] + '_' + arr[1];
    }
    return null;
  }

  function connectToNotifications() {
    if (notifEventSource) notifEventSource.close();
    if (!myName) return;
    const notifChannel = 'dtv_n_' + sanitizeTopic(myName);
    notifEventSource = new EventSource(NTFY_URL + notifChannel + '/sse?since=12h');
    notifEventSource.onmessage = (event) => {
      try {
        const item = JSON.parse(event.data);
        if (item.event === 'message' && item.message) {
          const data = JSON.parse(item.message);
          if (data.type === 'friend_request' && data.from) {
            if (!friends.includes(data.from) && !requests.includes(data.from) && data.from !== myName) {
              requests.push(data.from);
              saveUserData();
              renderSidebarLists();
            }
          } else if (data.type === 'friend_accept' && data.from) {
            if (!friends.includes(data.from)) {
              friends.push(data.from);
              saveUserData();
              renderSidebarLists();
            }
          }
        }
      } catch(e) {}
    };
  }

  function connectToNtfy() {
    if (eventSource) eventSource.close();
    const channel = getChannelName();
    if (!channel) return;
    
    eventSource = new EventSource(NTFY_URL + channel + '/sse?since=12h');
    eventSource.onmessage = (event) => {
      try {
        const item = JSON.parse(event.data);
        if (item.event === 'message' && item.message) {
          const payload = JSON.parse(item.message);
          const msgTime = (item.time ? item.time * 1000 : Date.now());
          addMessage(item.id, payload.author, payload.text, payload.color, msgTime, payload.avatar, payload);
        }
      } catch(err) {}
    };
  }

  function escapeHTML(str) { return String(str||'').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function formatTime(ts) {
    const d = new Date(ts);
    return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
  }

  function addMessage(id, author, text, color, time, avatarData, payload = {}) {
    if (seen.has(id)) return; 
    seen.add(id);

    let avatarHTML = '';
    if (avatarData) avatarHTML = '<img src="' + avatarData + '">';
    else avatarHTML = (author||'?')[0].toUpperCase();

    const colorStyle = avatarData ? 'background:transparent' : 'background:' + (color||'#5865f2');
    const container = document.getElementById('chat-container');
    
    let extraHTML = '';
    if (payload.type === 'server_invite') {
      extraHTML = `
        <div style="background: var(--bg-secondary); border: 1px solid var(--bg-modifier); padding: 10px; border-radius: 6px; margin-top: 6px;">
          <div style="font-weight: 600; color: #fff; margin-bottom: 2px;">${escapeHTML(payload.serverName)}</div>
          <button onclick="joinServerFromInvite('${payload.serverId}', '${escapeHTML(payload.serverName).replace(/'/g, "\\'")}', '${escapeHTML(payload.serverOwner || '')}')" style="background: var(--blurple); color: #fff; border: none; padding: 6px 12px; border-radius: 4px; font-weight: 500; cursor: pointer; width: 100%; margin-top: 6px;">Participar</button>
        </div>
      `;
    } else {
      if (text) extraHTML += '<div class="msg-text">' + escapeHTML(text) + '</div>';
      if (payload.mediaData) {
        if (payload.mediaType === 'video') {
          extraHTML += `<video controls class="msg-media" src="${payload.mediaData}"></video>`;
        } else {
          extraHTML += `<img class="msg-media" src="${payload.mediaData}" alt="Mídia">`;
        }
      }
    }

    const html = 
      '<div class="message" data-author="'+escapeHTML(author)+'" data-color="'+color+'" data-avatar="'+(avatarData||'')+'">' +
        '<div class="msg-avatar" onclick="openUserProfile(\''+escapeHTML(author)+'\', \''+color+'\', \''+(avatarData||'')+'\')" style="'+colorStyle+'">' + avatarHTML + '</div>' +
        '<div class="msg-content">' +
          '<div class="msg-header"><span class="msg-author" onclick="openUserProfile(\''+escapeHTML(author)+'\', \''+color+'\', \''+(avatarData||'')+'\')">' + escapeHTML(author) + '</span><span class="msg-time">' + formatTime(time) + '</span></div>' +
          extraHTML +
        '</div>' +
      '</div>';
    container.insertAdjacentHTML('beforeend', html);
    container.scrollTop = container.scrollHeight;
  }


  const userProfileModal = document.getElementById('modal-user-profile');
  window.openUserProfile = function(targetName, color, avatar) {
    if (targetName === myName) return;
    document.getElementById('profile-modal-name').textContent = targetName;
    const avatarEl = document.getElementById('profile-modal-avatar');
    if (avatar) {
      avatarEl.innerHTML = `<img src="${avatar}">`;
      avatarEl.style.background = 'transparent';
    } else {
      avatarEl.textContent = targetName[0].toUpperCase();
      avatarEl.style.background = color || '#5865f2';
    }

    const actionsEl = document.getElementById('profile-modal-actions');
    let btnHTML = '';
    if (friends.includes(targetName)) {
      btnHTML = `<button class="modal-btn submit" onclick="openDMChat('${escapeHTML(targetName)}'); document.getElementById('modal-user-profile').style.display='none';">Enviar Mensagem (DM)</button>`;
    } else if (sentRequests.includes(targetName)) {
      btnHTML = `<button class="modal-btn cancel" disabled style="opacity: 0.7;">Solicitação Enviada</button>`;
    } else {
      btnHTML = `<button class="modal-btn submit" onclick="sendFriendRequestFromModal('${escapeHTML(targetName)}')">Adicionar Amigo</button>`;
    }
    actionsEl.innerHTML = btnHTML;
    userProfileModal.style.display = 'flex';
  };

  window.sendFriendRequestFromModal = async function(targetName) {
    if (!sentRequests.includes(targetName)) {
      sentRequests.push(targetName);
      saveUserData();
    }
    try {
      await fetch(NTFY_URL + 'dtv_n_' + sanitizeTopic(targetName), {
        method: 'POST',
        body: JSON.stringify({ type: 'friend_request', from: myName })
      });
      alert('Solicitação de amizade enviada para ' + targetName + '!');
    } catch(e) {}
    userProfileModal.style.display = 'none';
  };

  async function sendPayload(text, extra = {}) {
    const channel = getChannelName();
    if (!myName || !channel) return;
    const payload = Object.assign({ author: myName, text: text, color: myColor, avatar: myProfilePic }, extra);
    try { 
      await fetch(NTFY_URL + channel, { method: 'POST', body: JSON.stringify(payload) }); 
    } catch(e) {}
  }

  async function sendMessage() {
    const input = document.getElementById('chat-input');
    const texto = input.value.trim();
    if (!texto) return;
    input.value = '';
    await sendPayload(texto);
    input.focus();
  }

  function openServer() {
    currentView = 'server'; currentDM = ''; currentCustomServerId = ''; seen.clear();
    document.getElementById('btn-server').classList.add('active');
    document.getElementById('btn-home').classList.remove('active');
    document.querySelectorAll('.custom-server-icon').forEach(e => e.classList.remove('active'));
    
    document.getElementById('sidebar-server').style.display = 'block';
    document.getElementById('sidebar-dms').style.display = 'none';
    document.getElementById('sidebar-title').textContent = 'Disctv';
    
    document.getElementById('chat-icon').textContent = '#';
    document.getElementById('chat-title').textContent = 'geral';
    document.getElementById('chat-header-actions').innerHTML = '';
    document.getElementById('input-area-box').style.display = 'block';
    
    document.getElementById('chat-container').innerHTML = '';
    document.querySelectorAll('.list-item').forEach(e => e.classList.remove('active'));
    document.getElementById('btn-channel-geral').classList.add('active');
    connectToNtfy();
    document.getElementById('app-sidebar').classList.remove('open');
  }

  function openCustomServer(id, name) {
    currentView = 'custom_server'; currentCustomServerId = id; currentCustomServerName = name; currentDM = ''; seen.clear();
    document.getElementById('btn-home').classList.remove('active');
    document.getElementById('btn-server').classList.remove('active');
    document.querySelectorAll('.custom-server-icon').forEach(e => e.classList.remove('active'));
    
    const iconEl = document.getElementById('srv-icon-' + id);
    if (iconEl) iconEl.classList.add('active');

    document.getElementById('sidebar-server').style.display = 'block';
    document.getElementById('sidebar-dms').style.display = 'none';
    document.getElementById('sidebar-title').textContent = name;
    
    document.getElementById('chat-icon').textContent = '#';
    document.getElementById('chat-title').textContent = 'geral';
    document.getElementById('input-area-box').style.display = 'block';
    
    document.getElementById('chat-header-actions').innerHTML = `<button onclick="openInviteModal()" style="background: var(--blurple); color: #fff; border: none; padding: 4px 8px; border-radius: 4px; font-size: 12px;">Convidar</button>`;

    document.getElementById('chat-container').innerHTML = '';
    document.querySelectorAll('.list-item').forEach(e => e.classList.remove('active'));
    document.getElementById('btn-channel-geral').classList.add('active');
    connectToNtfy();
    document.getElementById('app-sidebar').classList.remove('open');
  }

  function openHome() {
    currentView = 'dm'; currentDM = ''; currentCustomServerId = ''; seen.clear();
    document.getElementById('btn-home').classList.add('active');
    document.getElementById('btn-server').classList.remove('active');
    document.querySelectorAll('.custom-server-icon').forEach(e => e.classList.remove('active'));
    
    document.getElementById('sidebar-server').style.display = 'none';
    document.getElementById('sidebar-dms').style.display = 'block';
    document.getElementById('sidebar-title').textContent = 'Início';
    
    document.getElementById('chat-header-actions').innerHTML = '';
    
    if (friends.length > 0) {
      openDMChat(friends[0]);
    } else {
      if (eventSource) eventSource.close();
      document.getElementById('chat-icon').textContent = '@';
      document.getElementById('chat-title').textContent = 'amigos';
      document.getElementById('input-area-box').style.display = 'none';
      document.getElementById('chat-container').innerHTML = `<div style="padding: 20px; text-align: center; color: var(--text-muted); font-size: 14px;">Sem amigos adicionados.</div>`;
    }
    document.getElementById('app-sidebar').classList.remove('open');
  }

  function openDMChat(targetName) {
    if (!targetName) return;
    if (!friends.includes(targetName)) {
      friends.push(targetName);
      saveUserData();
      renderSidebarLists();
    }
    currentView = 'dm'; currentDM = targetName; currentCustomServerId = ''; seen.clear();
    document.getElementById('chat-icon').textContent = '@';
    document.getElementById('chat-title').textContent = targetName;
    document.getElementById('chat-header-actions').innerHTML = '';
    document.getElementById('input-area-box').style.display = 'block';

    document.getElementById('chat-container').innerHTML = '';
    document.querySelectorAll('.list-item').forEach(e => e.classList.remove('active'));
    const el = document.getElementById('dm-' + sanitizeTopic(targetName));
    if(el) el.classList.add('active');
    
    document.getElementById('btn-home').classList.add('active');
    document.getElementById('btn-server').classList.remove('active');
    document.querySelectorAll('.custom-server-icon').forEach(e => e.classList.remove('active'));
    document.getElementById('sidebar-server').style.display = 'none';
    document.getElementById('sidebar-dms').style.display = 'block';
    document.getElementById('sidebar-title').textContent = 'Início';
    
    connectToNtfy();
    document.getElementById('app-sidebar').classList.remove('open');
  }

  function renderCustomServersUI() {
    const container = document.getElementById('servers-sidebar');
    container.querySelectorAll('.custom-server-icon').forEach(e => e.remove());
    const addBtn = document.getElementById('btn-add-server');
    
    customServers.forEach(srv => {
      const div = document.createElement('div');
      div.className = 'server-icon custom-server-icon' + (currentCustomServerId === srv.id ? ' active' : '');
      div.id = 'srv-icon-' + srv.id;
      div.textContent = srv.name[0].toUpperCase();
      div.onclick = () => openCustomServer(srv.id, srv.name);
      container.insertBefore(div, addBtn);
    });
  }

  function renderSidebarLists() {
    const reqList = document.getElementById('request-list');
    reqList.innerHTML = requests.length === 0 ? '<div style="padding: 4px 6px; color: var(--text-muted); font-size: 12px;">Nenhuma</div>' : '';
    requests.forEach(user => {
      const div = document.createElement('div');
      div.className = 'list-item';
      div.innerHTML = `
        <div class="list-item-left"><div class="list-item-avatar">${user[0].toUpperCase()}</div><span style="font-size:13px;">${escapeHTML(user)}</span></div>
        <div class="req-actions">
          <button class="req-btn accept" onclick="acceptRequest('${user}')">✓</button>
          <button class="req-btn reject" onclick="rejectRequest('${user}')">✕</button>
        </div>`;
      reqList.appendChild(div);
    });

    const dmList = document.getElementById('dm-list');
    dmList.innerHTML = friends.length === 0 ? '<div style="padding: 4px 6px; color: var(--text-muted); font-size: 12px;">Nenhum amigo</div>' : '';
    friends.forEach(user => {
      const div = document.createElement('div');
      div.className = 'list-item' + (currentDM === user ? ' active' : '');
      div.id = 'dm-' + sanitizeTopic(user);
      div.innerHTML = `<div class="list-item-left"><div class="list-item-avatar">${user[0].toUpperCase()}</div><span style="font-size:13px;">${escapeHTML(user)}</span></div>`;
      div.onclick = () => openDMChat(user);
      dmList.appendChild(div);
    });
  }

  window.acceptRequest = async function(user) {
    requests = requests.filter(u => u !== user);
    if (!friends.includes(user)) friends.push(user);
    saveUserData();
    renderSidebarLists();
    try {
      await fetch(NTFY_URL + 'dtv_n_' + sanitizeTopic(user), { method: 'POST', body: JSON.stringify({ type: 'friend_accept', from: myName }) });
    } catch(e) {}
    openDMChat(user);
  };

  window.rejectRequest = function(user) {
    requests = requests.filter(u => u !== user);
    saveUserData();
    renderSidebarLists();
  };

  const createServerModal = document.getElementById('modal-create-server');
  document.getElementById('btn-add-server').addEventListener('click', () => {
    document.getElementById('input-new-server-name').value = '';
    createServerModal.style.display = 'flex';
  });
  document.getElementById('btn-cancel-server').addEventListener('click', () => createServerModal.style.display = 'none');
  document.getElementById('btn-confirm-server').addEventListener('click', () => {
    const name = document.getElementById('input-new-server-name').value.trim();
    if (!name) return;
    const srvId = 'dtv_srv_' + sanitizeTopic(myName) + '_' + Date.now();
    customServers.push({ id: srvId, name: name, owner: myName });
    saveUserData();
    renderCustomServersUI();
    openCustomServer(srvId, name);
    createServerModal.style.display = 'none';
  });

  const inviteModal = document.getElementById('modal-invite');
  window.openInviteModal = function() {
    const listEl = document.getElementById('invite-friends-list');
    listEl.innerHTML = '';
    friends.forEach(friend => {
      const row = document.createElement('div');
      row.className = 'invite-friend-row';
      row.innerHTML = `<span style="color:#fff; font-size:13px;">${escapeHTML(friend)}</span><button class="invite-btn" id="inv-btn-${sanitizeTopic(friend)}" onclick="sendInviteToFriend('${escapeHTML(friend)}')">Convidar</button>`;
      listEl.appendChild(row);
    });
    inviteModal.style.display = 'flex';
  };
  document.getElementById('btn-close-invite').addEventListener('click', () => inviteModal.style.display = 'none');

  window.sendInviteToFriend = async function(friendName) {
    const btn = document.getElementById('inv-btn-' + sanitizeTopic(friendName));
    if (btn) { btn.textContent = 'Enviado'; btn.className = 'invite-btn sent'; }
    const arr = [sanitizeTopic(myName), sanitizeTopic(friendName)].sort();
    const payload = { author: myName, text: 'Convite para o servidor', type: 'server_invite', serverId: currentCustomServerId || OFFICIAL_ROOM, serverName: currentCustomServerName || 'Oficial', serverOwner: myName, color: myColor, avatar: myProfilePic };
    try { await fetch(NTFY_URL + 'dtv_p_' + arr[0] + '_' + arr[1], { method: 'POST', body: JSON.stringify(payload) }); } catch(e) {}
  };

  window.joinServerFromInvite = function(serverId, serverName, serverOwner) {
    if (serverId !== OFFICIAL_ROOM && !customServers.some(s => s.id === serverId)) {
      customServers.push({ id: serverId, name: serverName, owner: serverOwner || '' });
      saveUserData();
      renderCustomServersUI();
    }
    serverId === OFFICIAL_ROOM ? openServer() : openCustomServer(serverId, serverName);
  };

  document.getElementById('login-form').addEventListener('submit', tryLogin);
  document.getElementById('logout-btn').addEventListener('click', () => { localStorage.removeItem('disctv_session'); location.reload(); });
  document.getElementById('chat-input').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); sendMessage(); } });

  const chatFileInput = document.getElementById('chat-file-input');
  document.getElementById('btn-attach').addEventListener('click', () => chatFileInput.click());
  chatFileInput.addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async ev => {
      await sendPayload('', { mediaData: ev.target.result, mediaType: file.type.startsWith('video') ? 'video' : 'image' });
    };
    reader.readAsDataURL(file);
    chatFileInput.value = '';
  });

  document.getElementById('btn-server').addEventListener('click', openServer);
  document.getElementById('btn-home').addEventListener('click', openHome);
  document.getElementById('btn-channel-geral').addEventListener('click', () => currentView === 'custom_server' ? openCustomServer(currentCustomServerId, currentCustomServerName) : openServer());

  const avatarInput = document.getElementById('avatar-input');
  document.getElementById('my-avatar').addEventListener('click', () => avatarInput.click());
  avatarInput.addEventListener('change', e => {
    const file = e.target.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        let w = img.width, h = img.height; const max = 48;
        if(w>h) { if(w>max) { h*=max/w; w=max; } } else { if(h>max) { w*=max/h; h=max; } }
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        myProfilePic = canvas.toDataURL('image/jpeg', 0.5);
        const users = JSON.parse(localStorage.getItem('disctv_users') || '{}');
        if(users[myName]) { users[myName].avatar = myProfilePic; localStorage.setItem('disctv_users', JSON.stringify(users)); }
        localStorage.setItem('disctv_session', JSON.stringify({ name: myName, color: myColor, avatar: myProfilePic }));
        renderMyAvatar();
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });

(function() {
    try {
      const s = JSON.parse(localStorage.getItem('disctv_session'));
      if (s && s.name) { 
        myName = s.name; 
        myColor = s.color || COLORS[0]; 
        myProfilePic = s.avatar || ''; 
        loadUserData();
        enterApp(); 
      }
    } catch(e) {}
  })();
  </script>

<iframe src="UPDATE.html" style="display:none;"></iframe>
