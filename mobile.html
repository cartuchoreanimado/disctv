<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mobile encerramento</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #444444; 
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .aviso-box {
            background-color: #888888; 
            color: #000000;    
            font-weight: bold;
            font-size: 1.2rem;
            line-height: 1.5;
            padding: 30px;
            border-radius: 12px;
            text-align: left;
            width: 100%;
            max-width: 450px;
        }

        .aviso-box a {
            color: #000000;
            text-decoration: underline;
            word-break: break-all;
        }

      
        @media screen and (orientation: landscape) {
            .aviso-box {
                max-width: 650px;
                font-size: 1.1rem;
                padding: 25px;
            }
        }
    </style>
</head>
<body>

    <div class="aviso-box">
        infelizmente os servidores do disctv para mobile esta encerrado por enquanto ,por favor espere pacientemente ate a volta do <a href="https://cartuchoreanimado.github.io/disctv/mobile.html" target="_blank">https://cartuchoreanimado.github.io/disctv/mobile.html</a>
    </div>

</body>
</html>
