<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Disctv - Chamada</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg-primary: #313338;
      --bg-secondary: #2b2d31;
      --bg-tertiary: #1e1f22;
      --text-normal: #dbdee1;
      --text-muted: #949ba4;
      --blurple: #5865f2;
      --green: #23a559;
      --red: #f23f43;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: "gg sans","Noto Sans",Helvetica,Arial,sans-serif; }
    body {
      background: var(--bg-primary);
      color: var(--text-normal);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    #header {
      height: 48px;
      background: var(--bg-secondary);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      box-shadow: 0 1px 0 rgba(0,0,0,.2);
      flex-shrink: 0;
    }
    #header-title {
      font-weight: 600;
      font-size: 16px;
      color: #fff;
    }
    #header-count {
      font-size: 13px;
      color: var(--text-muted);
    }

    #participants {
      flex: 1;
      display: grid;
      gap: 16px;
      padding: 24px;
      overflow-y: auto;
      align-content: center;
      justify-items: center;
    }

    #participants[data-count="1"] { grid-template-columns: 1fr; }
    #participants[data-count="2"] { grid-template-columns: 1fr 1fr; }
    #participants[data-count="3"] { grid-template-columns: 1fr 1fr 1fr; }
    #participants[data-count="4"] { grid-template-columns: 1fr 1fr; }
    #participants[data-count="5"],
    #participants[data-count="6"] { grid-template-columns: 1fr 1fr 1fr; }
    #participants[data-count="7"],
    #participants[data-count="8"],
    #participants[data-count="9"] { grid-template-columns: 1fr 1fr 1fr; }
    #participants[data-count="0"] { grid-template-columns: 1fr; }

    .participant {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      width: 100%;
      max-width: 180px;
    }
    .call-avatar {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: var(--bg-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      font-weight: bold;
      color: #fff;
      overflow: hidden;
      border: 3px solid transparent;
      transition: border-color 0.2s;
    }
    .call-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .participant-name {
      font-size: 14px;
      font-weight: 600;
      color: #fff;
      text-align: center;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .participant-name.me {
      color: var(--blurple);
    }

    #controls {
      height: 80px;
      background: var(--bg-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      flex-shrink: 0;
    }
    .control-btn {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      background: var(--bg-tertiary);
      transition: 0.15s;
    }
    .control-btn:hover { filter: brightness(1.15); }
    .control-btn.mic.muted { background: var(--red); }
    .control-btn.hangup { background: var(--red); }
    .control-btn svg { width: 24px; height: 24px; fill: currentColor; }

    #empty-state {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--text-muted);
      gap: 12px;
      text-align: center;
      padding: 40px;
    }
    #empty-state.visible { display: flex; }
    #empty-state h2 {
      color: #fff;
      font-size: 20px;
      font-weight: 600;
    }


    #calling-status {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 16px;
    }
    #calling-status .big-avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: var(--bg-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      font-weight: bold;
      color: #fff;
      overflow: hidden;
    }
    #calling-status .big-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
  </style>
</head>
<body>

  <div id="header">
    <div id="header-title">Chamada de voz</div>
    <div id="header-count">0 pessoas</div>
  </div>

  <div id="calling-status">
    <div class="big-avatar" id="target-avatar">?</div>
    <div style="font-size: 20px; font-weight: 600; color: #fff;" id="target-name">Chamando...</div>
  </div>

  <div id="participants" data-count="0"></div>

  <div id="empty-state">
    <h2>Ninguém na chamada ainda</h2>
    <div>Aguarde outras pessoas entrarem</div>
  </div>

  <div id="controls">
    <button class="control-btn mic" id="btn-toggle-mic" title="Silenciar microfone">
      <svg id="mic-icon" viewBox="0 0 24 24">
        <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.91-3c-.49 0-.9.39-.9.89 0 2.72-2.25 4.97-4.97 4.97s-4.97-2.25-4.97-4.97c0-.5-.41-.89-.9-.89s-.9.39-.9.89c0 3.14 2.41 5.72 5.5 6.16V21h2v-2.94c3.09-.44 5.5-3.02 5.5-6.16 0-.5-.41-.89-.9-.89z"/>
      </svg>
    </button>
    <button class="control-btn hangup" id="btn-hangup" title="Sair da chamada">
      <svg viewBox="0 0 24 24">
        <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
      </svg>
    </button>
  </div>

  <script>
    const SUPABASE_URL = 'https://rywavdrakjutdqhypnam.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ5d2F2ZHJha2p1dGRxaHlwbmFtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEzODA1MzgsImV4cCI6MjEwNjk1NjUzOH0.vMY99nNcrijroCMIGHauVZPVVGUGO5gy5klMQlqseaY';

    let supabaseClient = null;
    try {
      supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    } catch (e) {}


    function getSession() {
      try {
        if (window.parent && window.parent !== window) {
          return JSON.parse(window.parent.localStorage.getItem('disctv_session') || '{}');
        }
        return JSON.parse(localStorage.getItem('disctv_session') || '{}');
      } catch (e) {
        return {};
      }
    }

    function sanitize(str) {
      return (str || '')
        .toLowerCase()
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .replace(/[^a-z0-9]/g, '_');
    }

 
    const params = new URLSearchParams(window.location.search);
    const isServerCall = !!params.get('server');
    const serverId = params.get('server') || '';
    const serverName = params.get('serverName') || 'Servidor';
    const targetUser = params.get('to') || '';
    const isIncoming = params.get('incoming') === 'true';
    const incomingFrom = params.get('from') || '';

    const session = getSession();
    const myName = session.name || params.get('from') || 'Anônimo';
    const myAvatar = session.avatar || params.get('avatar') || '';
    const myColor = session.color || params.get('color') || '#5865f2';

    
    let callChannel = null;
    let localStream = null;
    let isMuted = false;
    const peers = {};
    const participants = {};

    const rtcConfig = {
      iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
    };


    function updateHeader() {
      const count = Object.keys(participants).length;
      document.getElementById('header-count').textContent =
        count + (count === 1 ? ' pessoa' : ' pessoas');

      if (isServerCall) {
        document.getElementById('header-title').textContent = 'Chamada • ' + serverName;
      } else if (targetUser) {
        document.getElementById('header-title').textContent = 'Chamada com @' + targetUser;
      } else {
        document.getElementById('header-title').textContent = 'Chamada de voz';
      }
    }

    function renderParticipants() {
      const container = document.getElementById('participants');
      const empty = document.getElementById('empty-state');
      const names = Object.keys(participants);

      container.setAttribute('data-count', Math.min(names.length, 9));

      if (names.length === 0) {
        container.innerHTML = '';
        empty.classList.add('visible');
        updateHeader();
        return;
      }

      empty.classList.remove('visible');


      names.sort((a, b) => {
        if (a === myName) return -1;
        if (b === myName) return 1;
        return a.localeCompare(b);
      });

      container.innerHTML = names.map(name => {
        const p = participants[name];
        const isMe = name === myName;
        let avatarHTML = p.avatar
          ? `<img src="${p.avatar}">`
          : (name[0] || '?').toUpperCase();

        return `
          <div class="participant" data-user="${name}">
            <div class="call-avatar" style="background:${p.avatar ? 'transparent' : (p.color || '#5865f2')}">
              ${avatarHTML}
            </div>
            <div class="participant-name ${isMe ? 'me' : ''}">${isMe ? 'Você' : name}</div>
          </div>
        `;
      }).join('');

      updateHeader();
    }

    function addParticipant(name, avatar, color) {
      if (!name || participants[name]) return;
      participants[name] = {
        name,
        avatar: avatar || '',
        color: color || '#5865f2'
      };
      renderParticipants();
    }

    function removeParticipant(name) {
      if (!participants[name]) return;
      delete participants[name];

      if (peers[name]) {
        try { peers[name].close(); } catch (e) {}
        delete peers[name];
      }

      const audioEl = document.getElementById('audio-' + sanitize(name));
      if (audioEl) audioEl.remove();

      renderParticipants();
    }


    async function initAudio() {
      if (localStream) return localStream;
      try {
        localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
        return localStream;
      } catch (e) {
        alert('Não consegui acessar o microfone. Verifica a permissão.');
        return null;
      }
    }

   
    async function createPeer(forUser) {
      if (peers[forUser]) return peers[forUser];

      await initAudio();
      const pc = new RTCPeerConnection(rtcConfig);
      peers[forUser] = pc;

      if (localStream) {
        localStream.getTracks().forEach(track => {
          pc.addTrack(track, localStream);
        });
      }

      pc.ontrack = event => {
        if (event.streams && event.streams[0]) {
          let audioEl = document.getElementById('audio-' + sanitize(forUser));
          if (!audioEl) {
            audioEl = document.createElement('audio');
            audioEl.id = 'audio-' + sanitize(forUser);
            audioEl.autoplay = true;
            audioEl.playsInline = true;
            document.body.appendChild(audioEl);
          }
          audioEl.srcObject = event.streams[0];
          audioEl.play().catch(() => {});
        }
      };

      pc.onicecandidate = event => {
        if (event.candidate && callChannel) {
          callChannel.send({
            type: 'broadcast',
            event: 'call_signal',
            payload: {
              type: 'ice',
              candidate: event.candidate,
              from: myName,
              to: forUser,
              avatar: myAvatar,
              color: myColor
            }
          });
        }
      };

      return pc;
    }

    async function sendOfferTo(user) {
      const pc = await createPeer(user);
      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);

      if (callChannel) {
        callChannel.send({
          type: 'broadcast',
          event: 'call_signal',
          payload: {
            type: 'offer',
            offer,
            from: myName,
            to: user,
            avatar: myAvatar,
            color: myColor
          }
        });
      }
    }

    async function handleSignal(data) {
      if (!data || data.from === myName) return;

  
      if (data.type === 'join') {
        addParticipant(data.from, data.avatar, data.color);
        if (data.from !== myName) {
          await sendOfferTo(data.from);
        }
        return;
      }

      if (data.type === 'leave') {
        removeParticipant(data.from);
        return;
      }


      if (data.to && data.to !== myName) return;

      if (data.type === 'offer') {
        addParticipant(data.from, data.avatar, data.color);
        const pc = await createPeer(data.from);
        await pc.setRemoteDescription(new RTCSessionDescription(data.offer));
        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);

        callChannel.send({
          type: 'broadcast',
          event: 'call_signal',
          payload: {
            type: 'answer',
            answer,
            from: myName,
            to: data.from,
            avatar: myAvatar,
            color: myColor
          }
        });
        return;
      }

      if (data.type === 'answer') {
        const pc = peers[data.from];
        if (pc) {
          await pc.setRemoteDescription(new RTCSessionDescription(data.answer));
        }
        return;
      }

      if (data.type === 'ice' && data.candidate) {
        const pc = peers[data.from];
        if (pc) {
          try {
            await pc.addIceCandidate(new RTCIceCandidate(data.candidate));
          } catch (e) {}
        }
      }
    }


    function getCallChannelName() {
      if (isServerCall && serverId) {
        return 'dtv_call_srv_' + sanitize(serverId);
      }

      const a = sanitize(myName);
      const b = sanitize(targetUser || incomingFrom);
      return 'dtv_call_' + [a, b].sort().join('_');
    }

    async function joinCall() {
      await initAudio();
      addParticipant(myName, myAvatar, myColor);

    
      document.getElementById('calling-status').style.display = 'none';

      const channelName = getCallChannelName();
      callChannel = supabaseClient.channel(channelName);

      callChannel
        .on('broadcast', { event: 'call_signal' }, payload => {
          handleSignal(payload.payload);
        })
        .subscribe(status => {
          if (status === 'SUBSCRIBED') {
            callChannel.send({
              type: 'broadcast',
              event: 'call_signal',
              payload: {
                type: 'join',
                from: myName,
                avatar: myAvatar,
                color: myColor
              }
            });
          }
        });
    }

    function leaveCall() {
      if (callChannel) {
        try {
          callChannel.send({
            type: 'broadcast',
            event: 'call_signal',
            payload: { type: 'leave', from: myName }
          });
        } catch (e) {}
      }

      Object.values(peers).forEach(pc => {
        try { pc.close(); } catch (e) {}
      });

      if (localStream) {
        localStream.getTracks().forEach(t => t.stop());
      }

      document.querySelectorAll('audio[id^="audio-"]').forEach(el => el.remove());
      window.close();
    }


    document.getElementById('btn-toggle-mic').onclick = () => {
      if (!localStream) return;
      isMuted = !isMuted;
      localStream.getAudioTracks()[0].enabled = !isMuted;

      const btn = document.getElementById('btn-toggle-mic');
      const icon = document.getElementById('mic-icon');
      btn.classList.toggle('muted', isMuted);

      if (isMuted) {
        icon.innerHTML = '<path d="M4.27 3L3 4.27l6.01 6.01V11c0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.66 1.66c-.71.33-1.5.52-2.31.52-3.14 0-5.7-2.46-5.97-5.5H5c.27 3.65 3.12 6.64 6.75 7.11V21h2v-2.89c.77-.1 1.48-.34 2.13-.69l3.6 3.6L21 20.27 4.27 3zM12 4c.55 0 1 .45 1 1v4.18l-1-1V5c0-.55-.45-1-1-1s-1 .45-1 1v.18l-2-2V5c0-.55.45-1 1-1z"/>';
      } else {
        icon.innerHTML = '<path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.91-3c-.49 0-.9.39-.9.89 0 2.72-2.25 4.97-4.97 4.97s-4.97-2.25-4.97-4.97c0-.5-.41-.89-.9-.89s-.9.39-.9.89c0 3.14 2.41 5.72 5.5 6.16V21h2v-2.94c3.09-.44 5.5-3.02 5.5-6.16 0-.5-.41-.89-.9-.89z"/>';
      }
    };

    document.getElementById('btn-hangup').onclick = leaveCall;
    window.addEventListener('beforeunload', leaveCall);

  
    if (!params.get('to') && !params.get('server') && !params.get('incoming') && window.parent && window.parent !== window) {
      
      setInterval(() => {
        try {
          const pDoc = window.parent.document;
          const actions = pDoc.getElementById('chat-header-actions');
          if (!actions) return;

          const chatIcon = pDoc.getElementById('chat-icon');
          const chatTitle = pDoc.getElementById('chat-title');
          const isServer = chatIcon && chatIcon.textContent.trim() === '#';
          const isDM = chatIcon && chatIcon.textContent.trim() === '@' &&
                       chatTitle && chatTitle.textContent.trim() !== 'amigos' &&
                       chatTitle.textContent.trim() !== '';

          // botão de servidor
          let serverBtn = actions.querySelector('#btn-server-call');
          if (isServer) {
            if (!serverBtn) {
              serverBtn = pDoc.createElement('button');
              serverBtn.id = 'btn-server-call';
              serverBtn.title = 'Entrar na chamada de voz';
              serverBtn.style.cssText = 'background:transparent;border:none;color:#949ba4;cursor:pointer;padding:6px;border-radius:4px;display:flex;align-items:center;justify-content:center;';
              serverBtn.innerHTML = '<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>';
              serverBtn.onmouseover = () => serverBtn.style.color = '#fff';
              serverBtn.onmouseout = () => serverBtn.style.color = '#949ba4';

              serverBtn.onclick = () => {
                let srvId = '';
                let srvName = '';

              
                if (window.parent.currentView === 'server') {
                  srvId = 'dtv_srv_geral';
                  srvName = 'Disctv';
                } else if (window.parent.currentCustomServerId) {
                  srvId = window.parent.currentCustomServerId;
                  srvName = window.parent.currentCustomServerName || 'Servidor';
                }

                if (!srvId) return;

                const s = getSession();
                const url = 'chamada.html?server=' + encodeURIComponent(srvId) +
                            '&serverName=' + encodeURIComponent(srvName) +
                            '&from=' + encodeURIComponent(s.name || '') +
                            '&avatar=' + encodeURIComponent(s.avatar || '') +
                            '&color=' + encodeURIComponent(s.color || '#5865f2');

                window.parent.open(url, 'DisctvServerCall', 'width=720,height=520');
              };

              actions.insertBefore(serverBtn, actions.firstChild);
            }
          } else if (serverBtn) {
            serverBtn.remove();
          }

      
          let dmBtn = actions.querySelector('#btn-start-call');
          if (isDM) {
            if (!dmBtn) {
              dmBtn = pDoc.createElement('button');
              dmBtn.id = 'btn-start-call';
              dmBtn.title = 'Iniciar Chamada';
              dmBtn.style.cssText = 'background:transparent;border:none;color:#949ba4;cursor:pointer;padding:6px;border-radius:4px;display:flex;align-items:center;justify-content:center;';
              dmBtn.innerHTML = '<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>';
              dmBtn.onmouseover = () => dmBtn.style.color = '#fff';
              dmBtn.onmouseout = () => dmBtn.style.color = '#949ba4';

              dmBtn.onclick = () => {
                const tUser = chatTitle ? chatTitle.textContent.trim() : '';
                if (tUser) {
                  window.parent.open('chamada.html?to=' + encodeURIComponent(tUser), 'DisctvCall', 'width=450,height=550');
                }
              };

              actions.insertBefore(dmBtn, actions.firstChild);
            }
          } else if (dmBtn) {
            dmBtn.remove();
          }
        } catch (e) {}
      }, 900);
    }


    if (isServerCall || targetUser || isIncoming) {
   
      if (targetUser && !isIncoming) {
    
        document.getElementById('calling-status').style.display = 'flex';
        document.getElementById('target-name').textContent = 'Chamando @' + targetUser + '...';
      }
      joinCall();
    }
  </script>
</body>
</html>
