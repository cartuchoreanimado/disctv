<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
</head>
<body>
<script>
  const NTFY_URL = 'https://ntfy.sh/';
  const STATUS_TOPIC = 'dtv_presence_network_v1';
  
  let userStatus = 'online';
  let idleTimer;
  let eventSource = null;

  function resetIdleTimer() {
    clearTimeout(idleTimer);
    if (userStatus === 'idle') {
      userStatus = 'online';
      sendStatus('online');
    }
    idleTimer = setTimeout(() => {
      userStatus = 'idle';
      sendStatus('idle');
    }, 120000);
  }

  ['mousemove', 'keydown', 'click', 'scroll', 'touchstart'].forEach(evt => {
    window.parent.addEventListener(evt, resetIdleTimer, { passive: true });
  });

  window.parent.addEventListener('visibilitychange', () => {
    if (window.parent.document.hidden) {
      userStatus = 'idle';
      sendStatus('idle');
    } else {
      userStatus = 'online';
      sendStatus('online');
      resetIdleTimer();
    }
  });

  window.addEventListener('beforeunload', () => {
    sendStatus('offline');
  });

  function sendStatus(st) {
    userStatus = st;
    const parentWin = window.parent;
    if (!parentWin.myName) return;
    
    const users = JSON.parse(parentWin.localStorage.getItem('disctv_users') || '{}');
    if (!users[parentWin.myName]) users[parentWin.myName] = {};
    users[parentWin.myName].status = st;
    users[parentWin.myName].lastPing = Date.now();
    parentWin.localStorage.setItem('disctv_users', JSON.stringify(users));

    fetch(NTFY_URL + STATUS_TOPIC, {
      method: 'POST',
      body: JSON.stringify({
        author: parentWin.myName,
        status: st,
        time: Date.now()
      })
    }).catch(e => {});
  }

  function connectStatusStream() {
    if (eventSource) eventSource.close();
    eventSource = new EventSource(NTFY_URL + STATUS_TOPIC + '/sse');
    eventSource.onmessage = (event) => {
      try {
        const item = JSON.parse(event.data);
        if (item.event === 'message' && item.message) {
          const data = JSON.parse(item.message);
          if (data.author && data.status) {
            const parentWin = window.parent;
            const users = JSON.parse(parentWin.localStorage.getItem('disctv_users') || '{}');
            if (!users[data.author]) users[data.author] = {};
            users[data.author].status = data.status;
            users[data.author].lastPing = data.time || Date.now();
            parentWin.localStorage.setItem('disctv_users', JSON.stringify(users));
          }
        }
      } catch(e) {}
    };
  }

  setInterval(() => {
    const parentWin = window.parent;
    if (!parentWin.myName) return;
    sendStatus(userStatus);
  }, 8000);

  setTimeout(connectStatusStream, 1000);

  setInterval(() => {
    const parentWin = window.parent;
    if (!parentWin) return;
    const parentDoc = parentWin.document;
    const users = JSON.parse(parentWin.localStorage.getItem('disctv_users') || '{}');
    const now = Date.now();

    parentDoc.querySelectorAll('.auto-status-dot').forEach(d => d.remove());

    if (parentWin.myName && users[parentWin.myName]) {
      const myAvatarEl = parentDoc.getElementById('my-avatar');
      if (myAvatarEl) {
        const ping = users[parentWin.myName].lastPing || 0;
        const isOffline = (now - ping > 20000);
        const st = isOffline ? 'offline' : (users[parentWin.myName].status || 'online');
        const color = st === 'online' ? '#2ecc71' : st === 'idle' ? '#f1c40f' : '#95a5a6';

        if (parentWin.getComputedStyle(myAvatarEl).position === 'static') {
          myAvatarEl.style.position = 'relative';
        }
        if (!myAvatarEl.querySelector('.auto-status-dot')) {
          const dot = parentDoc.createElement('div');
          dot.className = 'auto-status-dot';
          dot.style.position = 'absolute';
          dot.style.bottom = '0px';
          dot.style.right = '0px';
          dot.style.width = '10px';
          dot.style.height = '10px';
          dot.style.borderRadius = '50%';
          dot.style.border = '2px solid #232428';
          dot.style.zIndex = '10';
          dot.style.backgroundColor = color;
          myAvatarEl.appendChild(dot);
        }
      }
    }

    parentDoc.querySelectorAll('.message').forEach(msg => {
      const author = msg.getAttribute('data-author');
      if (author && users[author]) {
        const avatarContainer = msg.querySelector('.msg-avatar');
        if (avatarContainer) {
          const ping = users[author].lastPing || 0;
          const isOffline = (now - ping > 20000);
          const st = isOffline ? 'offline' : (users[author].status || 'online');
          const color = st === 'online' ? '#2ecc71' : st === 'idle' ? '#f1c40f' : '#95a5a6';

          if (parentWin.getComputedStyle(avatarContainer).position === 'static') {
            avatarContainer.style.position = 'relative';
          }
          if (!avatarContainer.querySelector('.auto-status-dot')) {
            const dot = parentDoc.createElement('div');
            dot.className = 'auto-status-dot';
            dot.style.position = 'absolute';
            dot.style.bottom = '0px';
            dot.style.right = '0px';
            dot.style.width = '10px';
            dot.style.height = '10px';
            dot.style.borderRadius = '50%';
            dot.style.border = '2px solid #313338';
            dot.style.zIndex = '10';
            dot.style.backgroundColor = color;
            avatarContainer.appendChild(dot);
          }
        }
      }
    });

    Object.keys(users).forEach(uname => {
      const ping = users[uname].lastPing || 0;
      const isOffline = (now - ping > 20000);
      const st = isOffline ? 'offline' : (users[uname].status || 'online');
      const color = st === 'online' ? '#2ecc71' : st === 'idle' ? '#f1c40f' : '#95a5a6';

      parentDoc.querySelectorAll('.list-item, [data-username]').forEach(el => {
        const text = el.textContent || '';
        if (text.includes(uname)) {
          const av = el.querySelector('.list-item-avatar, img');
          if (av) {
            let container = av.parentElement;
            if (container) {
              if (parentWin.getComputedStyle(container).position === 'static') {
                container.style.position = 'relative';
              }
              if (!container.querySelector('.auto-status-dot')) {
                const dot = parentDoc.createElement('div');
                dot.className = 'auto-status-dot';
                dot.style.position = 'absolute';
                dot.style.bottom = '0px';
                dot.style.right = '0px';
                dot.style.width, dot.style.height = '10px';
                dot.style.width = '10px';
                dot.style.height = '10px';
                dot.style.borderRadius = '50%';
                dot.style.border = '2px solid #2b2d31';
                dot.style.zIndex = '10';
                dot.style.backgroundColor = color;
                container.appendChild(dot);
              }
            }
          }
        }
      });
    });
  }, 1500);
</script>
</body>
</html>
