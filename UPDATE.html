<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
</head>
<body>
<script>
  let userStatus = 'online';
  let idleTimer;

  function resetIdleTimer() {
    clearTimeout(idleTimer);
    if (userStatus === 'idle') {
      userStatus = 'online';
      updateMyStatus('online');
    }
    idleTimer = setTimeout(() => {
      userStatus = 'idle';
      updateMyStatus('idle');
    }, 120000);
  }

  ['mousemove', 'keydown', 'click', 'scroll', 'touchstart'].forEach(evt => {
    window.parent.addEventListener(evt, resetIdleTimer, { passive: true });
  });

  window.parent.addEventListener('visibilitychange', () => {
    if (window.parent.document.hidden) {
      userStatus = 'idle';
      updateMyStatus('idle');
    } else {
      userStatus = 'online';
      updateMyStatus('online');
      resetIdleTimer();
    }
  });

  setInterval(() => {
    const parentWin = window.parent;
    if (!parentWin.myName) return;
    const users = JSON.parse(parentWin.localStorage.getItem('disctv_users') || '{}');
    if (!users[parentWin.myName]) users[parentWin.myName] = {};
    users[parentWin.myName].status = userStatus;
    users[parentWin.myName].lastPing = Date.now();
    parentWin.localStorage.setItem('disctv_users', JSON.stringify(users));
    updateDots();
  }, 3000);

  function updateMyStatus(status) {
    userStatus = status;
    const parentWin = window.parent;
    if (!parentWin.myName) return;
    const users = JSON.parse(parentWin.localStorage.getItem('disctv_users') || '{}');
    if (users[parentWin.myName]) {
      users[parentWin.myName].status = status;
      users[parentWin.myName].lastPing = Date.now();
      parentWin.localStorage.setItem('disctv_users', JSON.stringify(users));
    }
  }

  function updateDots() {
    const parentWin = window.parent;
    const parentDoc = parentWin.document;
    const users = JSON.parse(parentWin.localStorage.getItem('disctv_users') || '{}');
    const now = Date.now();

    parentDoc.querySelectorAll('.auto-status-dot').forEach(d => d.remove());

    Object.keys(users).forEach(username => {
      const lastPing = users[username].lastPing || 0;
      const isReallyOffline = (now - lastPing > 10000);
      const st = isReallyOffline ? 'offline' : (users[username].status || 'online');

      parentDoc.querySelectorAll('img').forEach(img => {
        let container = img.closest('.message, .user-item, .member, .friend, div');
        if (!container) return;

        const textContent = container.textContent || '';
        const dataUser = container.getAttribute('data-username') || '';
        
        if (dataUser === username || textContent.includes(username)) {
          let imgParent = img.parentElement;
          if (imgParent) {
            if (parentWin.getComputedStyle(imgParent).position === 'static') {
              imgParent.style.position = 'relative';
            }
            
            if (!imgParent.querySelector('.auto-status-dot')) {
              let dot = parentDoc.createElement('div');
              dot.className = 'auto-status-dot';
              dot.style.position = 'absolute';
              dot.style.bottom = '0px';
              dot.style.right = '0px';
              dot.style.width = '10px';
              dot.style.height = '10px';
              dot.style.borderRadius = '50%';
              dot.style.border = '2px solid #2f3136';
              dot.style.zIndex = '10';
              dot.style.backgroundColor = st === 'online' ? '#2ecc71' : st === 'idle' ? '#f1c40f' : '#95a5a6';
              imgParent.appendChild(dot);
            }
          }
        }
      });
    });
  }
</script>
</body>
</html>
